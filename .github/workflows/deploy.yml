name: Build & Deploy Glass On The Street

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-glassonthestreet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The accuracy suite: importer fidelity, every number against an independent calculation, rendered HTML
      # and API against the same. Offline, about 30 seconds. A failure stops the deploy.
      - name: Test
        run: dotnet test ./src/GlassOnTheStreet.Tests/GlassOnTheStreet.Tests.csproj -c Release --verbosity minimal

      - name: Publish
        run: dotnet publish ./src/GlassOnTheStreet.Web/GlassOnTheStreet.Web.csproj -c Release -o ./publish

      - name: Stop service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: sudo systemctl stop glassonthestreet

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude=appsettings.local.json
            --exclude=appsettings.Production.json
          path: ./publish/
          remote_path: /var/www/glassonthestreet.com/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Start service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: sudo systemctl start glassonthestreet

      - name: Smoke check
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sleep 3
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:5011/ || true